<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Product List</title>
    <link rel="stylesheet" href="style7.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<header>
    <h1>Book Store</h1>
</header>

<div class="container mt-4">
    <div class="row" id="bookList"></div>
</div>

<script>
const books = [
    { title: "Harry Potter", price: 499 },
    { title: "Atomic Habits", price: 399 },
    { title: "Rich Dad Poor Dad", price: 299 }
];

const container = document.getElementById("bookList");

books.forEach(book => {
    container.innerHTML += `
       <div class="col-md-4">
            <div class="card p-3">
                <h3>${book.title}</h3>
                <p>Price: ₹${book.price}</p>
            </div>
       </div>
    `;
});
</script>

</body>
</html>
